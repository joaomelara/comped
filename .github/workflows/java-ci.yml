name: Java Spring Boot CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------
  # 1) Build e Testes
  # ----------------------------------------
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes automatizados
        run: mvn test

      - name: Build com Maven
        run: mvn clean package -DskipTests

      - name: Upload artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: comped:latest
          outputs: type=docker,dest=/tmp/comped-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/comped-image.tar
          retention-days: 1