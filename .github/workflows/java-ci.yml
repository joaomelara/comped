name: Java Spring Boot CI/CD

on:
  push:
    branches: [ "main", "feat/build-implementation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------
  # 1) Build e Testes
  # ----------------------------------------
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes automatizados
        run: mvn test

      - name: Build com Maven
        run: mvn clean package -DskipTests

      - name: Upload artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: comped:latest
          outputs: type=docker,dest=/tmp/comped-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/comped-image.tar
          retention-days: 1

  # ----------------------------------------
  # 2) Deploy — Staging
  # ----------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/comped-image.tar

      - name: Validar docker-compose com variáveis de staging
        run: docker compose --env-file .env.staging config

      - name: Verificar imagem Docker carregada
        run: docker images | grep comped || echo "Imagem não encontrada"

      - name: Start Oracle Database
        run: |
          docker run -d \
            --name oracle-staging \
            -e ORACLE_PASSWORD="260504" \
            -p 1521:1521 \
            gvenzl/oracle-xe:latest
          
          # Wait for Oracle to be ready (max 180 seconds)
          echo "Aguardando Oracle inicializar..."
          max_attempts=90
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Try to connect using sqlplus
            if docker exec oracle-staging sqlplus -S -L sys/260504@localhost:1521/xe as sysdba <<< "SELECT 1 FROM DUAL;" 2>&1 | grep -q "1"; then
              echo "✅ Oracle iniciado e conectável com sucesso!"
              break
            else
              attempt=$((attempt + 1))
              echo "Tentativa $attempt/$max_attempts... Aguardando Oracle..."
              sleep 2
            fi
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Oracle não respondeu após 180 segundos"
            docker logs oracle-staging | tail -30
            exit 1
          fi

      - name: Simular deploy staging (com banco de dados)
        run: |
          # Carregar variáveis de staging
          set -a && source .env.staging && set +a
          
          # Remover container anterior se existir
          docker rm -f comped-staging 2>/dev/null || true
          
          # Criar network para conectar app ao banco
          docker network create comped-ci 2>/dev/null || true
          
          # Conectar Oracle à network
          docker network connect comped-ci oracle-staging 2>/dev/null || true
          
          # Criar e executar container com conexão ao banco
          echo "Iniciando container comped-staging..."
          docker run -d \
            --name comped-staging \
            --network comped-ci \
            -e SPRING_PROFILES_ACTIVE=staging \
            -e SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-staging:1521:xe \
            -e SPRING_DATASOURCE_USERNAME=system \
            -e SPRING_DATASOURCE_PASSWORD=260504 \
            -e MINHA_CHAVE_SECRETA=$JWT_SECRET \
            -e LOGGING_LEVEL_BR_COM_FIAP_COMPED=$LOG_LEVEL \
            -p 8080:8080 \
            comped:latest
          
          # Aguardar inicialização (aumentado para 40 segundos)
          echo "Aguardando Spring Boot iniciar..."
          sleep 40
          
          # Verificar se container está rodando
          if docker ps | grep comped-staging > /dev/null; then
            echo "✅ Container comped-staging está rodando"
            echo "=== Últimos 50 linhas de logs ===" 
            docker logs comped-staging | tail -50
            echo "=== Fim dos logs ==="
            
            # Verificar se app iniciou com sucesso (sem erros no log)
            if docker logs comped-staging 2>&1 | grep -q "Started CompedApplication"; then
              echo "✅✅ CompedApplication iniciado com sucesso!"
              exit 0
            fi
            
            if docker logs comped-staging 2>&1 | grep -q "Application run failed"; then
              echo "❌ Aplicação falhou ao iniciar. Verifique os logs acima."
              exit 1
            fi
          else
            echo "❌ Container não está rodando. Logs:"
            docker logs comped-staging 2>&1 || echo "Sem logs disponíveis"
            exit 1
          fi
          
          # Limpar (sempre executar mesmo se houver erro)
          docker stop comped-staging oracle-staging 2>/dev/null || true
          docker rm -f comped-staging oracle-staging 2>/dev/null || true
          docker network rm comped-ci 2>/dev/null || true

      - name: Deploy staging concluído
        run: echo "Ambiente STAGING validado com sucesso."

  # ----------------------------------------
  # 3) Deploy — Produção (apenas branch main)
  # ----------------------------------------
  deploy-prod:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/comped-image.tar

      - name: Start Oracle Database
        run: |
          docker run -d \
            --name oracle-prod \
            -e ORACLE_PASSWORD="260504" \
            -p 1522:1521 \
            gvenzl/oracle-xe:latest
          
          # Wait for Oracle to be ready (max 180 seconds)
          echo "Aguardando Oracle inicializar..."
          max_attempts=90
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Try to connect using sqlplus
            if docker exec oracle-prod sqlplus -S -L sys/260504@localhost:1521/xe as sysdba <<< "SELECT 1 FROM DUAL;" 2>&1 | grep -q "1"; then
              echo "✅ Oracle iniciado e conectável com sucesso!"
              break
            else
              attempt=$((attempt + 1))
              echo "Tentativa $attempt/$max_attempts... Aguardando Oracle..."
              sleep 2
            fi
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Oracle não respondeu após 180 segundos"
            docker logs oracle-prod | tail -30
            exit 1
          fi

      - name: Simular deploy produção (com banco de dados)
        run: |
          # Carregar variáveis de produção
          set -a && source .env.prod && set +a
          
          # Remover container anterior se existir
          docker rm -f comped-prod 2>/dev/null || true
          
          # Criar network para conectar app ao banco
          docker network create comped-ci-prod 2>/dev/null || true
          
          # Conectar Oracle à network
          docker network connect comped-ci-prod oracle-prod 2>/dev/null || true
          
          # Criar e executar container com conexão ao banco
          echo "Iniciando container comped-prod..."
          docker run -d \
            --name comped-prod \
            --network comped-ci-prod \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-prod:1521:xe \
            -e SPRING_DATASOURCE_USERNAME=system \
            -e SPRING_DATASOURCE_PASSWORD=260504 \
            -e MINHA_CHAVE_SECRETA=$JWT_SECRET \
            -e LOGGING_LEVEL_BR_COM_FIAP_COMPED=$LOG_LEVEL \
            -p 8081:8080 \
            comped:latest
          
          # Aguardar inicialização (aumentado para 40 segundos)
          echo "Aguardando Spring Boot iniciar..."
          sleep 40
          
          # Verificar se container está rodando
          if docker ps | grep comped-prod > /dev/null; then
            echo "✅ Container comped-prod está rodando"
            echo "=== Últimos 50 linhas de logs ===" 
            docker logs comped-prod | tail -50
            echo "=== Fim dos logs ==="
            
            # Verificar se app iniciou com sucesso (sem erros no log)
            if docker logs comped-prod 2>&1 | grep -q "Started CompedApplication"; then
              echo "✅✅ CompedApplication iniciado com sucesso!"
              exit 0
            fi
            
            if docker logs comped-prod 2>&1 | grep -q "Application run failed"; then
              echo "❌ Aplicação falhou ao iniciar. Verifique os logs acima."
              exit 1
            fi
          else
            echo "❌ Container não está rodando. Logs:"
            docker logs comped-prod 2>&1 || echo "Sem logs disponíveis"
            exit 1
          fi
          
          # Limpar (sempre executar mesmo se houver erro)
          docker stop comped-prod oracle-prod 2>/dev/null || true
          docker rm -f comped-prod oracle-prod 2>/dev/null || true
          docker network rm comped-ci-prod 2>/dev/null || true

      - name: Deploy produção concluído
        run: echo "Ambiente PRODUÇÃO validado com sucesso."