name: Java Spring Boot CI/CD

on:
  push:
    branches: [ "main", "feat/build-implementation" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------
  # 1) Build e Testes
  # ----------------------------------------
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes automatizados
        run: mvn test

      - name: Build com Maven
        run: mvn clean package -DskipTests

      - name: Upload artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: comped:latest
          outputs: type=docker,dest=/tmp/comped-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/comped-image.tar
          retention-days: 1

  # ----------------------------------------
  # 2) Deploy — Staging
  # ----------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/comped-image.tar

      - name: Start Oracle Database
        run: |
          docker run -d \
            --name oracle-staging \
            -e ORACLE_PASSWORD="260504" \
            -p 1521:1521 \
            gvenzl/oracle-xe:latest
          
          # Wait for Oracle to be ready (max 180 seconds)
          echo "Aguardando Oracle inicializar..."
          max_attempts=90
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Try to connect using sqlplus
            if docker exec oracle-staging sqlplus -S -L sys/260504@localhost:1521/xe as sysdba <<< "SELECT 1 FROM DUAL;" 2>&1 | grep -q "1"; then
              echo "✅ Oracle iniciado e conectável com sucesso!"
              break
            else
              attempt=$((attempt + 1))
              echo "Tentativa $attempt/$max_attempts... Aguardando Oracle..."
              sleep 2
            fi
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Oracle não respondeu após 180 segundos"
            docker logs oracle-staging | tail -30
            exit 1
          fi
          
          # Give extra time for network initialization
          sleep 10

      - name: Simular deploy staging (com banco de dados)
        run: |
          # Use docker-compose for proper networking
          docker compose -f docker-compose.staging.yml up -d
          
          # Wait for app to be ready
          echo "Aguardando aplicação iniciar..."
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Check if app is responding
            if curl -f http://localhost:8080/health 2>/dev/null | grep -q "UP"; then
              echo "✅✅ Aplicação iniciada e saudável!"
              exit 0
            else
              attempt=$((attempt + 1))
              echo "Tentativa $attempt/$max_attempts... Aguardando saúde da aplicação..."
              sleep 2
            fi
          done
          
          echo "❌ Aplicação não respondeu após 120 segundos"
          docker compose -f docker-compose.staging.yml logs app
          docker compose -f docker-compose.staging.yml down
          exit 1

      - name: Cleanup after staging deploy
        if: always()
        run: |
          docker compose -f docker-compose.staging.yml down -v 2>/dev/null || true
          docker rm -f oracle-staging comped-staging 2>/dev/null || true

      - name: Deploy staging concluído
        run: echo "Ambiente STAGING validado com sucesso."

  # ----------------------------------------
  # 3) Deploy — Produção (apenas branch main)
  # ----------------------------------------
  deploy-prod:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Carregar imagem Docker
        run: docker load --input /tmp/comped-image.tar

      - name: Start Oracle Database
        run: |
          docker run -d \
            --name oracle-prod \
            -e ORACLE_PASSWORD="260504" \
            -p 1522:1521 \
            gvenzl/oracle-xe:latest
          
          # Wait for Oracle to be ready (max 180 seconds)
          echo "Aguardando Oracle inicializar..."
          max_attempts=90
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Try to connect using sqlplus
            if docker exec oracle-prod sqlplus -S -L sys/260504@localhost:1521/xe as sysdba <<< "SELECT 1 FROM DUAL;" 2>&1 | grep -q "1"; then
              echo "✅ Oracle iniciado e conectável com sucesso!"
              break
            else
              attempt=$((attempt + 1))
              echo "Tentativa $attempt/$max_attempts... Aguardando Oracle..."
              sleep 2
            fi
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Oracle não respondeu após 180 segundos"
            docker logs oracle-prod | tail -30
            exit 1
          fi
          
          # Give extra time for network initialization
          sleep 10

      - name: Simular deploy produção (com banco de dados)
        run: |
          # Use docker-compose for proper networking
          docker compose -f docker-compose.prod.yml up -d
          
          # Wait for app to be ready
          echo "Aguardando aplicação iniciar..."
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            # Check if app is responding
            if curl -f http://localhost:8081/health 2>/dev/null | grep -q "UP"; then
              echo "✅✅ Aplicação iniciada e saudável!"
              exit 0
            else
              attempt=$((attempt + 1))
              echo "Tentativa $attempt/$max_attempts... Aguardando saúde da aplicação..."
              sleep 2
            fi
          done
          
          echo "❌ Aplicação não respondeu após 120 segundos"
          docker compose -f docker-compose.prod.yml logs app
          docker compose -f docker-compose.prod.yml down
          exit 1

      - name: Cleanup after production deploy
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v 2>/dev/null || true
          docker rm -f oracle-prod comped-prod 2>/dev/null || true

      - name: Deploy produção concluído
        run: echo "Ambiente PRODUÇÃO validado com sucesso."